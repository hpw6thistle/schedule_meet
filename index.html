<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>總公司會議室預約系統</title>
<meta property="og:type" content="website">
<meta property="og:title" content="總公司會議室預約系統">
<meta property="og:site_name" content="總公司會議室預約系統">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="總公司會議室預約系統">
<meta name="application-version" content="v2.0.29">
<link rel="stylesheet" href="styles.css?v=2.0.29.1">
</head>
<body>
<div class="page"><header class="navbar appNavbar" aria-label="主要導覽">
<button type="button" id="navHome" class="navHomeBack" aria-label="返回首頁"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>首頁</button>
<nav class="mainNav" aria-label="功能分頁"><button type="button" id="navSchedule" class="navTab">預約會議</button><button type="button" id="topMine" class="navTab">我的會議 <span class="navCount" id="myCount">0</span></button></nav>
<div class="navtool" id="navtool" hidden><div class="toolGroup"><div class="quickAnchor"><button id="quickOpen" class="btn compactIcon" aria-label="快速找會議室" type="button" aria-expanded="false" aria-controls="quickPopover" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m16 16 4 4"/></svg><span class="srOnly">快速找會議室</span><span id="quickDurationLabel" hidden class="quickDurationLabel">60 分鐘</span></button><div id="quickPopover" class="quickPopover" role="dialog" aria-label="快速找空房" hidden><div class="quickPopoverTitle">預約時長</div><div class="quickDurations" role="group" aria-label="預約時長"><button type="button" data-quick-duration="1">30 分鐘</button><button type="button" data-quick-duration="2">60 分鐘</button><button type="button" data-quick-duration="3">90 分鐘</button><button type="button" data-quick-duration="4">120 分鐘</button></div><button id="quickApply" type="button" class="quickApply">顯示空檔</button></div></div></div></div>
</header>
<main class="main">
<section id="homeView" class="view immersiveHome" aria-label="首頁">
  <div class="immersiveBackdrop" aria-hidden="true"></div>
  <div class="immersiveWash" aria-hidden="true"></div>
  <div class="immersiveNoise" aria-hidden="true"></div>
  <div class="heroFrame">
    <div class="heroDock">
      <div class="heroMeta" id="heroDate"></div>
      
      <div class="todayRooms" id="todayRooms" aria-label="會議室資訊"><div class="todayRoomsList" id="todayRoomsList"></div></div>
      <div class="heroAction"><button type="button" id="heroMinePrimary" class="heroCTA">預約會議</button></div>
    </div>
  </div>
</section>

<section id="scheduleView" class="view">
<div class="surface scheduleSurface"><div class="toolbar"><div class="dateGroup"><button class="iconbtn" id="prevDay" aria-label="前一天">‹</button><button class="btn dateTrigger" id="dateTrigger" aria-expanded="false" aria-haspopup="dialog"><span id="currentDate"></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="btn" id="monthViewToggle" type="button" aria-pressed="false" aria-label="切換月曆檢視"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg></button><button class="iconbtn" id="nextDay" aria-label="後一天">›</button><button class="btn today" id="todayBtn">今天</button></div>
<select id="monthlyRoomFilter" class="select monthlyRoomFilter" aria-label="篩選會議室" hidden></select><div id="calendarPopover" class="calendarPopover" role="dialog" aria-label="選擇日期" hidden><div class="monthNav"><button type="button" class="calendarHeading" id="monthTitle" aria-label="切換月份選擇"></button><div class="monthBtns"><button id="monthPrev" class="iconbtn" aria-label="上一個期間">‹</button><button id="monthNext" class="iconbtn" aria-label="下一個期間">›</button></div></div><div class="calGrid" id="calGrid"></div><div class="calendarFooter"><button class="btn" id="calendarToday">今天</button></div></div></div><div class="mobileRoomPicker" id="mobileRoomPicker" role="group" aria-label="選擇會議室"></div><div class="scheduleScroll" id="scheduleScroll"><div class="schedule" id="schedule"></div></div><div id="monthlyView" class="monthlyView" hidden><div class="monthlyNav"><button type="button" class="iconbtn" id="monthlyPrev" aria-label="上個月">‹</button><strong id="monthlyTitle"></strong><button type="button" class="iconbtn" id="monthlyNext" aria-label="下個月">›</button></div><div class="monthlyScroll" tabindex="0" aria-label="月曆，可左右滑動"><div id="monthlyGrid" class="monthlyGrid"></div></div></div><div class="footerline"></div></div>
</section>
<section id="mineView" class="view" hidden><div class="surface minePanel"><div class="mineToolbar"><select id="mineStatus" class="select" aria-label="預約狀態"><option value="upcoming">即將到來</option><option value="all">全部預約</option><option value="past">歷史預約</option></select><select id="mineRoom" class="select" aria-label="會議室篩選"><option value="all">所有會議室</option></select><input id="mineDate" class="field" type="date" aria-label="預約日期篩選"><button id="clearMineFilters" class="btn">清除篩選</button></div><div class="mineList" id="mineList"></div></div></section>
</main></div>
<div id="popup" class="popShell" hidden><div id="scrim" class="scrim"></div><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="dialogClose" class="iconbtn closeButton" aria-label="關閉">×</button></div><div class="dialogContent" id="dialogContent"></div><div class="dialogFoot" id="dialogFoot"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js?v=2.0.29.1"></script></body></html>
